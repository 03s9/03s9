<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#170f29"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: url(#bg); stroke: #2d1b4e; stroke-width: 1.5; rx: 10px; }
