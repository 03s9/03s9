name: Generate 3D Profile & Pac-Man

on:
  schedule: # Roda automaticamente todo dia às 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite rodar manualmente com 1 clique
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 8. Gera o Gráfico 3D Isométrico de Commits
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push 3D Profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || git commit -m "Update 3D profile"
          git push

      # 9. Gera o Pac-Man comendo os Commits
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
