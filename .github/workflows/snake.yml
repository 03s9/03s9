name: snake
on:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generated-assets
  cancel-in-progress: false
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: dashboard
        run: |
          mkdir -p dist
          python3 scripts/gen_dashboard.py "${{ github.repository_owner }}" dist/dashboard.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: personal section (AniList + Last.fm)
        continue-on-error: true
        run: python3 scripts/gen_personal.py 03s9 ayame2400 dist
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: leetcode card
        continue-on-error: true
        run: python3 scripts/gen_leetcode.py ayamme dist/leetcode.svg
      - name: bonsai (git-bonsai v1.0.0, pinned; commit handled by the step below)
        continue-on-error: true
        uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3
        with:
          commit: "false"
          output-dir: assets/generated
      - name: bonsai scene
        continue-on-error: true
        run: python3 scripts/gen_bonsai_scene.py
      - name: graphs (repos, saved, taste)
        continue-on-error: true
        run: python3 scripts/gen_graphs.py "${{ github.repository_owner }}" 03s9 ayame2400 dist/graphs.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: activity + heatmap
        continue-on-error: true
        run: |
          python3 scripts/gen_activity.py "${{ github.repository_owner }}" dist/activity.svg
          python3 scripts/gen_heatmap.py "${{ github.repository_owner }}" dist/heatmap.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
      - name: commit generated assets
        run: |
          mkdir -p assets/generated
          cp dist/*.svg assets/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || { git commit -m "chore: update generated assets"; git pull --rebase origin "$GITHUB_REF_NAME"; git push; }
