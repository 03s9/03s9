<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Vitor Góngora, data engineering, backend and AI tooling">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#16213A"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<radialGradient id="g1" cx="0.9" cy="0.05" r="0.6"><stop offset="0" stop-color="#22C55E" stop-opacity="0.25"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/></pattern>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.cur{animation:b 1.1s steps(1) 6}
@keyframes b{50%{opacity:0}}
.f{animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cur,.f{animation:none}}
</style>
</defs>
<rect width="1000" height="300" rx="20" fill="url(#bg)"/>
<rect width="1000" height="300" rx="20" fill="url(#grid)" opacity=".7"/>
<rect width="1000" height="300" rx="20" fill="url(#g1)"/>
<rect width="1000" height="300" rx="20" fill="url(#g2)"/>
<g class="f" opacity=".9"><circle cx="880" cy="90" r="46" fill="none" stroke="url(#tx)" stroke-width="2"/><circle cx="880" cy="90" r="26" fill="none" stroke="#334155" stroke-width="1.5"/><circle cx="880" cy="90" r="6" fill="#22C55E"/></g>
<g opacity=".9"><path d="M790 200 l-16 16 16 16" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M850 200 l16 16 -16 16" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M826 196 l-10 40" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/></g>
<rect x=".5" y=".5" width="999" height="299" rx="19.5" fill="none" stroke="#334155"/>
<g fill="#334155"><circle cx="40" cy="36" r="6"/><circle cx="62" cy="36" r="6"/></g><circle cx="84" cy="36" r="6" fill="#22C55E"/>
<text x="48" y="104" class="m" font-size="24" fill="#94A3B8">$ whoami</text>
<text x="48" y="170" class="s" font-size="68" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Vitor Góngora</text>
<text x="48" y="238" class="m" font-size="28" font-weight="600" fill="url(#tx)"><animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.3s" fill="freeze"/>data engineering · backend · AI tooling</text>
</svg>
