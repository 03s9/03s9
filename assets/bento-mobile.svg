<svg xmlns="http://www.w3.org/2000/svg" width="600" height="622" viewBox="0 0 600 622" role="img" aria-label="Foco, stack e agora"><title>Foco, stack e agora</title><style>.h{font:900 26px 'Courier New',ui-monospace,monospace;fill:#0032A8;letter-spacing:2px}.t{font:700 17px 'Courier New',ui-monospace,monospace;fill:#0032A8}</style><rect width="600" height="622" rx="12" fill="#FC3B7F"/><rect x="28" y="28" width="552" height="186" rx="8" fill="#0032A8"/><rect x="20" y="20" width="552" height="186" rx="8" fill="#FEF1CF" stroke="#0032A8" stroke-width="3"/><text x="44" y="60" class="h">FOCO</text><rect x="44" y="72" width="48" height="4" fill="#0032A8"/><text x="44" y="108" class="t">&gt; Pipelines de dados e extração</text><text x="44" y="136" class="t">&gt; de documentos</text><text x="44" y="164" class="t">&gt; Motores nativos em Rust</text><text x="44" y="192" class="t">&gt; Agentes de IA e LLMs locais</text><rect x="28" y="238" width="552" height="158" rx="8" fill="#0032A8"/><rect x="20" y="230" width="552" height="158" rx="8" fill="#FEF1CF" stroke="#0032A8" stroke-width="3"/><text x="44" y="270" class="h">STACK</text><rect x="44" y="282" width="48" height="4" fill="#0032A8"/><text x="44" y="318" class="t">&gt; Python · SQL · Polars · DuckDB</text><text x="44" y="346" class="t">&gt; Rust · Java · TypeScript</text><text x="44" y="374" class="t">&gt; FastAPI · Pydantic · Docker</text><rect x="28" y="420" width="552" height="186" rx="8" fill="#0032A8"/><rect x="20" y="412" width="552" height="186" rx="8" fill="#FEF1CF" stroke="#0032A8" stroke-width="3"/><text x="44" y="452" class="h">AGORA</text><rect x="44" y="464" width="48" height="4" fill="#0032A8"/><text x="44" y="500" class="t">&gt; Explorando motores de dados nativos</text><text x="44" y="528" class="t">&gt; e mineração de papers do arXiv.</text><text x="44" y="556" class="t">&gt; Aberto a conversar sobre dados,</text><text x="44" y="584" class="t">&gt; backend e automação com IA.</text></svg>
